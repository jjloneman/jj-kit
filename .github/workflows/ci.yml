name: ☁️ CI

on:
  pull_request: {}
  push:
    branches: [main]

# A PR that gets a second push has no use for the first push's verdict, so
# supersede it. A `main` push is a record of that commit, never cancelled.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.event_name == 'pull_request' && 'pr' || github.sha }}

# Nothing by default; each job grants only what it uses.
permissions: {}

# Each job's `name` is a required status check in `.github/rulesets/main.json`,
# so renaming one means updating the ruleset in the same PR.
jobs:
  # Every PR adds or edits a changeset, through the kit's own action; see
  # docs/decisions/changeset-every-pr.md.
  #
  # - The action skips a Renovate PR that ships nothing, so this job still
  #   reports success on it as a required check.
  #
  # - The version PR, `changeset-release/main` from this repo opened by
  #   `github-actions[bot]`, skips the whole job, which counts as passing,
  #   so it needs no checkout or install; the action would skip it too.
  #
  # - This condition mirrors `require-changeset`'s `version-pr-authors`
  #   input, so change the two together; if they drift, the action still
  #   skips the version PR, which only costs the install.
  changeset:
    name: 🦋 Changeset
    if: >-
      ${{ github.event_name == 'pull_request' && !(
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'changeset-release/main' &&
      github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, so the base branch exists to diff against.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./actions/setup
      - uses: ./actions/require-changeset

  lint:
    name: 🧹 Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup

      # Uncached, unlike `pnpm lint`: typed linting makes a file's verdict
      # depend on the types it imports, which a content-keyed cache can't see.
      - run: pnpm exec eslint .

      # After ESLint, so the richer error surfaces first when both fail.
      - run: pnpm format:check

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup

      # Builds and checks every package that defines `lint:package`; passes
      # with nothing to pack.
      - run: pnpm lint:package

  # Installs only the root's `dependencies`, as `release.yml`'s privileged job
  # does, so a package its version path needs but that install misses fails
  # here, not only on `main`; see docs/decisions/unprivileged-release-build.md.
  #
  # - It runs on the version PR too, since the fabricated changeset below
  #   gives `changeset version` work on any branch.
  #
  # - The publish path needs a pack and a registry, so only the version path
  #   runs.
  release-install:
    name: 🚀 Release install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Shallow, like the release job's checkout, so `changeset version` runs
      # the same `git fetch --deepen` the release job does to find each
      # changeset's commit.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup
        with:
          cache: false
          install: root

      # Resolves the CLI through `version-or-release`'s own check, then runs
      # it as changesets/action v2.1.2 does, `node` on that `bin.js`, so it
      # fails where the release job would.
      #
      # - The fabricated changeset bumps a real package, so `version` loads
      #   the config, the changelog formatter and the `format` setting even
      #   while only empty changesets are pending.
      #
      # - That package is `kit-changesets-changelog`, so renaming or removing
      #   it means updating the changeset here.
      #
      # - The runner discards everything it writes.
      - name: 🦋 Version a fabricated changeset
        run: |
          printf '%s\n' '---' \
            '"@jjloneman/kit-changesets-changelog": patch' '---' '' \
            'Check the narrow release install.' \
            > .changeset/ci-release-install.md

          cli=$(bash actions/version-or-release/resolve-changesets-cli.sh \
            "release install")

          node "$cli" version

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup
      - run: pnpm test:coverage

  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup
      - run: pnpm typecheck
