name: ☁️ CI

on:
  pull_request: {}
  push:
    branches: [main]

# A PR that gets a second push has no use for the first push's verdict, so
# supersede it. A `main` push is a record of that commit, never cancelled.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.event_name == 'pull_request' && 'pr' || github.sha }}

# Nothing by default; each job grants only what it uses.
permissions: {}

# Each job's `name` is a required status check in `.github/rulesets/main.json`,
# so renaming one means updating the ruleset in the same PR.
jobs:
  # Every PR adds or edits a changeset, through the kit's own action; see
  # docs/decisions/changeset-every-pr.md.
  #
  # - The action skips a Renovate PR that ships nothing, so this job still
  #   reports success on it as a required check.
  #
  # - The version PR, `changeset-release/main` from this repo opened by
  #   `github-actions[bot]`, skips the whole job, which counts as passing,
  #   so it needs no checkout or install; the action would skip it too.
  #
  # - This condition mirrors `require-changeset`'s `version-pr-authors`
  #   input, so change the two together; if they drift, the action still
  #   skips the version PR, which only costs the install.
  changeset:
    name: 🦋 Changeset
    if: >-
      ${{ github.event_name == 'pull_request' && !(
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'changeset-release/main' &&
      github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The full history, so the base branch exists to diff against.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./actions/setup
      - uses: ./actions/require-changeset

  lint:
    name: 🧹 Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup

      # Uncached, unlike `pnpm lint`: typed linting makes a file's verdict
      # depend on the types it imports, which a content-keyed cache can't see.
      - run: pnpm exec eslint .

      # After ESLint, so the richer error surfaces first when both fail.
      - run: pnpm format:check

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup

      # Builds and checks every package that defines `lint:package`; passes
      # with nothing to pack.
      - run: pnpm lint:package

  # Temporary, for #6's PR only, removed before merge: checks that
  # `node-version` reaches setup-node and that an empty value fails early.
  setup-inputs:
    name: 🧪 Setup inputs (temporary)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # jj-kit's own `devEngines` is expected to refuse the install on Node 24.
      - name: 🧰 Set up with Node 24
        id: node24
        uses: ./actions/setup
        with:
          node-version: "24"

        continue-on-error: true
      - name: 🔍 Check Node 24 was installed
        env:
          OUTCOME: ${{ steps.node24.outcome }}
        shell: bash
        run: |
          node --version
          echo "setup outcome: $OUTCOME"
          [[ "$(node --version)" == v24.* ]]

      - name: 🧰 Set up with an empty version
        id: empty
        uses: ./actions/setup
        with:
          node-version: ""

        continue-on-error: true
      - name: 🔍 Check the empty version failed
        env:
          OUTCOME: ${{ steps.empty.outcome }}
        shell: bash
        run: |
          echo "setup outcome: $OUTCOME"
          [[ "$OUTCOME" == failure ]]
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup
      - run: pnpm test:coverage

  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup
      - run: pnpm typecheck
