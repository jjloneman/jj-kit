name: 🦋 Version PR or release
description: >-
  Keeps the rolling Changesets version PR open, labeled and assigned, while
  changesets are pending, and publishes the release `pack-release` packed once
  it merges.

# Needs, from the caller:
#
# - a job that runs after `pack-release`'s, with `needs:` on it, and only
#   while its `next` output isn't `none`;
#
# - a push to the release branch, with `contents: write` and
#   `pull-requests: write`, plus `id-token: write` for npm trusted publishing;
#
# - "Allow GitHub Actions to create and approve pull requests" on, in the
#   repo's Actions settings, when `github-token` is `GITHUB_TOKEN`;
#
# - a checkout, and Node 26 and pnpm with `@changesets/cli` 3 or later
#   installed in the repo root, along with every plugin
#   `.changeset/config.json` loads and, unless its `format` is false, the
#   formatter Changesets runs on the CHANGELOGs; usually from
#   `jjloneman/jj-kit/actions/setup`, whose `install: root` installs the
#   root's `dependencies` alone, though a consumer may keep its own setup
#   step;
#
# - the `label` in the repo, or the step that labels the version PR fails.
inputs:
  assignee:
    default: ""
    description: The login to assign the version PR to; empty assigns no one.
  commit-message:
    default: "chore(release): 🚀 version packages"
    description: The version PR's commit message.
  github-token:
    description: >-
      The token that opens the version PR and pushes tags, such as
      `secrets.GITHUB_TOKEN`.
    required: true
  label:
    default: 🚀 release
    description: >-
      The label to add to the version PR, which must exist in the repo; empty
      adds none.
  next:
    description: >-
      `pack-release`'s `next` output: `version` to open or update the version
      PR, or `publish` to publish its pack.
    required: true
  pack-dir-artifact-id:
    default: ""
    description: >-
      `pack-release`'s `pack-dir-artifact-id` output, the pack to publish when
      `next` is `publish`.
  pr-title:
    default: "chore(release): 🚀 version packages"
    description: The version PR's title.

outputs:
  pr-number:
    description: The version PR's number, when one was opened or updated.
    value: ${{ steps.version.outputs.pr-number }}
  published:
    description: '"true" when packages were published, else "false".'
    value: ${{ steps.publish.outputs.published || 'false' }}
  published-packages:
    description: >-
      A JSON array of the published packages, such as `[{"name": "a",
      "version": "1.0.0"}]`.
    value: ${{ steps.publish.outputs.published-packages || '[]' }}

runs:
  using: composite
  steps:
    # A typo, or a job that runs on `none`, would otherwise skip both steps
    # below and pass without a word.
    - name: 🔍 Check the inputs
      env:
        NEXT: ${{ inputs.next }}
        PACK_DIR_ARTIFACT_ID: ${{ inputs.pack-dir-artifact-id }}
      shell: bash
      run: |
        if [ "$NEXT" != version ] && [ "$NEXT" != publish ]; then
          echo "::error::next must be \"version\" or \"publish\", from" \
            "pack-release, but was \"$NEXT\"."
          exit 1
        fi
        if [ "$NEXT" = publish ] && [ -z "$PACK_DIR_ARTIFACT_ID" ]; then
          echo "::error::pack-dir-artifact-id is empty, so there's no pack" \
            "to publish."
          exit 1
        fi

    # Both sub-actions run `node` on the CLI's `bin.js`, resolved from the repo
    # root, and otherwise fail with a bare resolve error.
    #
    # - The usual cause is `setup`'s `install: root` in a repo that keeps
    #   `@changesets/cli` in `devDependencies`, which that install skips.
    - name: 🔍 Check the Changesets CLI
      shell: bash
      run: >-
        bash "$GITHUB_ACTION_PATH/resolve-changesets-cli.sh" version-or-release
        > /dev/null

    - name: 🦋 Open or update the version PR
      id: version
      if: ${{ inputs.next == 'version' }}
      uses: changesets/action/version@v2.1.2
      with:
        commit-message: ${{ inputs.commit-message }}
        github-token: ${{ inputs.github-token }}
        pr-title: ${{ inputs.pr-title }}

    # The publish sub-action never reads the pending changesets, so empty ones
    # left on `main` don't stop it.
    - name: 🚀 Publish
      id: publish
      if: ${{ inputs.next == 'publish' }}
      uses: changesets/action/publish@v2.1.2
      with:
        github-token: ${{ inputs.github-token }}
        pack-dir-artifact-id: ${{ inputs.pack-dir-artifact-id }}

    # changesets/action has no assignee or label option, so add them here.
    - name: 🏷️ Label and assign the version PR
      if: >-
        ${{ steps.version.outputs.pr-number != '' && (inputs.assignee != ''
        || inputs.label != '') }}
      env:
        ASSIGNEE: ${{ inputs.assignee }}
        GH_TOKEN: ${{ inputs.github-token }}
        LABEL: ${{ inputs.label }}
        PR_NUMBER: ${{ steps.version.outputs.pr-number }}
      shell: bash
      run: |
        args=()
        if [ -n "$ASSIGNEE" ]; then
          args+=(--add-assignee "$ASSIGNEE")
        fi
        if [ -n "$LABEL" ]; then
          args+=(--add-label "$LABEL")
        fi
        gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" "${args[@]}"
