name: 🧰 Set up Node and install
description: >-
  Installs pnpm, Node and the frozen-lockfile dependency tree; the prelude
  every CI job that runs a pnpm script shares.

# Needs, from the caller:
#
# - a checkout of the repo, with `packageManager` in its root `package.json`,
#   which picks the pnpm version;
#
# - a `pnpm-lock.yaml` that matches the workspace, since the install is
#   frozen;
#
# - with `install: root`, every package the job runs in the root's
#   `dependencies`, since devDependencies and workspace packages are skipped.
inputs:
  cache:
    default: "true"
    description: >-
      Whether to restore and save the pnpm store cache; pass `false` in a job
      that holds write permissions or `id-token: write`, or builds what's
      published, so it never installs from a store another job saved.

  install:
    default: all
    description: >-
      What to install: `all`, the whole workspace, or `root`, only the
      workspace root's `dependencies`, for a job that runs nothing else, such
      as the one that versions or publishes; `root` needs `cache: false`.

  node-version:
    default: "26"
    description: >-
      The Node to install; pass an older one only for a job that tests the
      repo's own published code on it.

runs:
  using: composite
  steps:
    # An empty input, such as an unset matrix value, would make setup-node
    # install nothing and keep the runner's own Node, so fail first.
    - name: 🔍 Check the Node version input
      env:
        NODE_VERSION: ${{ inputs.node-version }}
      shell: bash
      run: |
        if [[ -z "${NODE_VERSION//[[:space:]]/}" ]]; then
          echo "::error title=setup::node-version is empty; pass a version such as \"26\", or leave it out."
          exit 1
        fi

    # pnpm/action-setup's own parse of an empty or misspelled value fails with
    # a generic YAML error, so check it here first.
    #
    # - A job that can request an OIDC token, as `id-token: write` allows, gets
    #   a warning while the cache is on.
    #
    # - `contents: write` leaves no trace in the job's environment, so a job
    #   holding only that gets no warning.
    - name: 🔍 Check the cache input
      env:
        CACHE: ${{ inputs.cache }}
      shell: bash
      run: |
        case "$CACHE" in
          true | True | TRUE) ;;
          false | False | FALSE) exit 0 ;;
          *)
            echo "::error title=setup::cache must be true or false; leave it out to keep the cache on."
            exit 1
            ;;
        esac

        if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "::warning title=setup::This job can request an OIDC token but restores the pnpm store cache; pass cache: false so it never installs from a store another job saved."
        fi

    # Fails a misspelled value before pnpm and Node install, rather than at
    # the install step, which checks it again.
    #
    # - `root` with the cache on would save a store of the root's
    #   `dependencies` alone under the lockfile's key, which every full install
    #   then restores and never replaces, so it needs `cache: false`.
    - name: 🔍 Check the install input
      env:
        CACHE: ${{ inputs.cache }}
        INSTALL: ${{ inputs.install }}
      shell: bash
      run: |
        case "$INSTALL" in
          all | All | ALL) ;;
          root | Root | ROOT)
            case "$CACHE" in
              false | False | FALSE) ;;
              *)
                echo "::error title=setup::install: root needs cache: false, or it saves a partial pnpm store that full installs then restore."
                exit 1
                ;;
            esac
            ;;
          *)
            echo "::error title=setup::install must be all or root; leave it out to install the whole workspace."
            exit 1
            ;;
        esac

    # The cache is an input because a store saved after another job's steps
    # ran mustn't reach a job that can push or publish, or builds what's
    # published.
    #
    # - As of v6.1.1, pnpm/action-setup has no restore-only mode, so such a job
    #   turns the cache off entirely; see
    #   docs/decisions/unprivileged-release-build.md.
    #
    # - The `pnpm install` below still has to link node_modules out of the
    #   store, which no store cache can remove.
    - name: 📦 Install pnpm
      uses: pnpm/action-setup@v6.1.1
      with:
        cache: ${{ inputs.cache }}

    # Defaults to Node 26, the one the kit supports; see
    # docs/decisions/node-26-only.md.
    #
    # - Its own automatic cache stays off, since pnpm/action-setup owns the
    #   store cache and `cache: false` turns off only that one.
    - name: 🟢 Install Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    # `root` installs the root's `dependencies` alone, for a job that can push
    # or publish.
    #
    # - It never links the dev tools that job doesn't run; see
    #   docs/decisions/unprivileged-release-build.md.
    - name: 🔗 Install dependencies
      env:
        INSTALL: ${{ inputs.install }}
      shell: bash
      run: |
        case "$INSTALL" in
          all | All | ALL) pnpm install --frozen-lockfile ;;
          root | Root | ROOT) pnpm install --frozen-lockfile --prod --filter . ;;
          *)
            echo "::error title=setup::install must be all or root."
            exit 1
            ;;
        esac
