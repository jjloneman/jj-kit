# Copied from okf-tools until the kit ships its own setup action; #6 replaces it
# with the kit's `setup` action.
name: 🧰 Set up Node and install
description: >-
  Installs pnpm, Node 26, and the frozen-lockfile dependency tree — the prelude
  every CI job that runs a pnpm script shares.

runs:
  using: composite
  steps:
    # `cache: true` restores the pnpm store; the `pnpm install` below still has
    # to link node_modules out of it, which no store cache can remove.
    - uses: pnpm/action-setup@v6.1.1
      with:
        cache: true

    # The one Node the kit supports, matching `engines.node`.
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: "26"

    - shell: bash
      run: pnpm install --frozen-lockfile
