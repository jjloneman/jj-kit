name: ☁️ CI

on:
  pull_request: {}
  push:
    branches: [main]

# A PR that gets a second push has no use for the first push's verdict, so
# supersede it. A `main` push is a record of that commit, never cancelled.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.event_name == 'pull_request' && 'pr' || github.sha }}

# Nothing by default; each job grants only what it uses.
permissions: {}

# Each job's `name` is a required status check in `.github/rulesets/main.json`,
# so renaming one means updating the ruleset in the same PR.
jobs:
  lint:
    name: 🧹 Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Uncached, unlike `pnpm lint`: typed linting makes a file's verdict
      # depend on the types it imports, which a content-keyed cache can't see.
      - run: pnpm exec eslint .

      # After ESLint, so the richer error surfaces first when both fail.
      - run: pnpm format:check

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Builds and checks every package that defines `lint:package`; passes
      # with nothing to pack.
      - run: pnpm lint:package

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage

  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
