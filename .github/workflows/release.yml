name: 🚀 Release

on:
  push:
    branches: [main]

  # Run on `main` by hand ("Run workflow") when a version PR's merge published
  # nothing; re-running an old run would act on its old commit.
  workflow_dispatch: {}

# One release run at a time, so two never publish or push the version branch
# at once.
#
# - It doesn't queue: GitHub keeps one pending run per group and cancels it
#   when a newer one arrives, which can drop the run that should publish.
#
# - The next run on `main` with no releasing changeset pending publishes what
#   was dropped, and the `workflow_dispatch` above starts one by hand.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

# Nothing by default; each job grants only what it uses.
permissions: {}

jobs:
  # Decides, builds and packs with no write access, since the build runs every
  # dev dependency's code.
  plan:
    name: 📦 Plan and pack

    # A dispatch on another branch would version or publish from it.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      next: ${{ steps.pack.outputs.next }}
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      # The tags let Changesets see what's tagged without `git ls-remote`,
      # which fails without credentials in a private repo.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false

      - uses: ./actions/setup

      # Publishes past empty changesets, so a version PR's merge with one left
      # on `main` still publishes.
      - name: 📦 Pack the release
        id: pack
        uses: ./actions/pack-release
        with:
          build-script: pnpm build

  release:
    name: 🦋 Version PR or publish
    if: ${{ needs.plan.outputs.next != 'none' }}
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write

      # Trusted publishing: npm trades this OIDC token for a one-off publish
      # token, and the same identity signs the provenance statement.
      id-token: write
      pull-requests: write
    steps:
      # changesets/action v2 pushes through the API with its own token, so
      # install scripts never see a persisted write token.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup

      - uses: ./actions/version-or-release
        with:
          assignee: jjloneman
          github-token: ${{ secrets.GITHUB_TOKEN }}
          next: ${{ needs.plan.outputs.next }}
          pack-dir-artifact-id: ${{ needs.plan.outputs.pack-dir-artifact-id }}
