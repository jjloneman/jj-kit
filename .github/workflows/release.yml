name: 🚀 Release

on:
  push:
    branches: [main]

  # Run on `main` by hand ("Run workflow") when a version PR's merge published
  # nothing; re-running an old run would act on its old commit.
  workflow_dispatch: {}

# One release run at a time, so two never publish or push the version branch
# at once.
#
# - It doesn't queue: GitHub keeps one pending run per group and cancels it
#   when a newer one arrives, which can drop the run that should publish.
#
# - The next run on `main` with no releasing changeset pending publishes what
#   was dropped, and the `workflow_dispatch` above starts one by hand.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

# Nothing by default; each job grants only what it uses.
permissions: {}

jobs:
  release:
    name: 🦋 Version PR or publish

    # A dispatch on another branch would version or publish from it.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

      # Trusted publishing: npm trades this OIDC token for a one-off publish
      # token, and the same identity signs the provenance statement.
      id-token: write
      pull-requests: write
    steps:
      # changesets/action v2 pushes through the API with its own token, so
      # install and build scripts never see a persisted write token.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./actions/setup

      # Publishes whenever no releasing changeset is pending, so a version
      # PR's merge with an empty changeset left on `main` still publishes.
      - uses: ./actions/version-or-release
        with:
          assignee: jjloneman
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
